<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-width: 100%;
    background: #000;
    line-height: 0;
    overflow-x: hidden;
}

.video-wrapper {
    position: relative;
    display: block;
    width: 100%;
    margin: 0;
    padding: 0;
}

#videoPolos {
    display: block;
    width: 100%;
    height: auto;
    margin: 0;
    padding: 0;
    border: 0;
    outline: 0;
    background: #000;
}

#errorMessage {
    display: none;
    width: 100%;
    min-height: 100vh;
    box-sizing: border-box;
    align-items: center;
    justify-content: center;
    color: #fff;
    background: #000;
    font-family: Arial, sans-serif;
    font-size: 16px;
    line-height: normal;
    text-align: center;
}
</style>
</head>

<body>

<div class="video-wrapper">

    <video
        id="videoPolos"
        controls
        playsinline
        preload="metadata">

        <source
            id="videoSource"
            src=""
            type="video/mp4">

    </video>

</div>

<div id="errorMessage">
    Video tidak ditemukan.
</div>

<!-- KODE POPUNDER RESMI ADSTERRA DI SINI -->

<script>
document.addEventListener("DOMContentLoaded", function () {

    const params = new URLSearchParams(
        window.location.search
    );

    const slug = params.get("v");

    const video = document.getElementById(
        "videoPolos"
    );

    const source = document.getElementById(
        "videoSource"
    );

    const errorMessage = document.getElementById(
        "errorMessage"
    );

    if (!slug) {
        tampilkanError();
        return;
    }

    fetch("videos.json")

        .then(function (response) {

            if (!response.ok) {
                throw new Error(
                    "videos.json gagal dimuat"
                );
            }

            return response.json();

        })

        .then(function (data) {

            const videoData = data[slug];

            if (!videoData) {
                tampilkanError();
                return;
            }

            source.src = videoData.video;

            video.load();

        })

        .catch(function (error) {

            console.error(error);

            tampilkanError();

        });

    function tampilkanError() {

        video.style.display = "none";

        errorMessage.style.display = "flex";

    }

});
</script>

</body>
</html>
