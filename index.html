<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>VIP Player</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            background: #08070c;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #0f0e17;
            min-height: 100vh;
            border-left: 1px solid #232232; 
            border-right: 1px solid #232232;
            border-bottom: 1px solid #232232;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3.2;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #videoPolos {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .overlay {
            display: flex;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 10;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .btn-play-glass {
            width: 76px;
            height: 76px;
            background: rgba(236, 72, 153, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            color: #ffffff;
            font-size: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding-left: 6px;
            animation: pulse-play 2s infinite;
            transition: transform 0.2s;
        }

        @keyframes pulse-play {
            0% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.7); }
            70% { box-shadow: 0 0 0 18px rgba(236, 72, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
        }

        .btn-play-glass:active {
            transform: scale(0.9);
        }

        #liveViewers {
            font-size: 12px;
            font-weight: 700;
            color: #ff3333;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 12px 16px;
        }

        .live-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background-color: #ff0000;
            border-radius: 50%;
            animation: kedipKamera 1.2s infinite ease-in-out;
            flex-shrink: 0;
        }

        @keyframes kedipKamera {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.85); }
        }

        .server-bar {
            display: flex;
            background: #15141f;
            padding: 8px 16px;
            gap: 10px;
            border-bottom: 1px solid #232232;
        }

        .server-btn {
            flex: 1;
            padding: 7px 0;
            background: #201f2d;
            border: 1px solid #2d2b3f;
            color: #a09cb0;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .server-btn.active {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: #fff;
            border: none;
        }

        .controls-nav {
            display: flex;
            gap: 10px;
            padding: 14px 16px;
            background: #0f0e17;
        }

        .btn-nav {
            flex: 1;
            padding: 13px 0;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-prev {
            background: #201f2d;
            color: #ffffff;
            border: 1px solid #2d2b3f;
        }

        .btn-next {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.35);
        }

        .btn-nav:active {
            transform: scale(0.96);
        }

        .title-section {
            padding: 16px 0 16px 30px;
            background: #0f0e17;
        }

        .info-section {
            padding: 0 16px 14px 16px;
            background: #0f0e17;
        }

        .video-title {
            font-size: 18px;
            font-weight: 800;
            margin: 0 0 10px 0;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .video-title i {
            color: #ec4899;
        }

        .badges-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            font-size: 11px;
            color: #9ab0c7;
            white-space: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .badges-row::-webkit-scrollbar {
            display: none;
        }

        .badge-pill {
            background: #8b5cf6;
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 11px;
            flex-shrink: 0;
        }

        .badge-hot {
            background: #ec4899;
        }

        .meta-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .meta-item i {
            color: #8b5cf6;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 14px;
        }

        .btn-action {
            padding: 9px 0;
            background: #181724;
            color: #d1cbdc;
            border: 1px solid #262436;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
        }

        .btn-action i {
            color: #ec4899;
        }

        .tele-wrapper {
            padding: 0 16px 20px 16px;
        }

        .btn-telegram {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 0;
            background: linear-gradient(135deg, #0088cc, #006699);
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(0, 136, 204, 0.3);
        }

        #errorMessage {
            display: none;
            width: 100%;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            color: #fff;
            background: #000;
            font-size: 16px;
            text-align: center;
        }
    </style>
</head>
<body>

        <div id="liveViewers">
            <span class="live-dot"></span>

        <div class="controls-nav">
            <button id="btnPrev" class="btn-nav btn-prev"><i class="fa-solid fa-arrow-left"></i> Video Sebelumnya</button>

                <span class="badge-pill badge-hot">HD</span>

             </div>

         <div class="info-section">

                <button class="btn-action" id="btnLove" data-ad="https://layinghypothesis.com/t7pgs2uek7?key=b4d0a9ccbdeab1ce09b94e2b66968e28"><i class="fa-solid fa-heart"></i> <span id="likeCount">4.8K</span></button>
                <button class="btn-action" data-ad="https://layinghypothesis.com/t7pgs2uek7?key=b4d0a9ccbdeab1ce09b94e2b66968e28"><i class="fa-solid fa-bookmark"></i> Simpan</button>
                <button class="btn-action" data-ad="https://layinghypothesis.com/t7pgs2uek7?key=b4d0a9ccbdeab1ce09b94e2b66968e28"><i class="fa-solid fa-download"></i> Unduh</button>
                <button class="btn-action" data-ad="https://layinghypothesis.com/t7pgs2uek7?key=b4d0a9ccbdeab1ce09b94e2b66968e28"><i class="fa-solid fa-share-nodes"></i> Bagikan</button>
            </div>
        </div>

        <div class="tele-wrapper">
            <a href="https://t.me/+Wd9QJyO5fq9iOWQ1" target="_blank" rel="noopener noreferrer" class="btn-telegram">
                <i class="fa-brands fa-telegram"></i> JOIN TELEGRAM STOK VIRAL FULL
            </a>
        </div>

    <div id="errorMessage">
        Video tidak ditemukan.
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
    const WORKER_URL = 'https://vip-trackers.zonexhub.workers.dev';
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("v");

    function sendTelegramLog(eventTitle, detailInfo = '') {
        if (!WORKER_URL || WORKER_URL.includes('namakamu')) return;

        const timeNow = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        const message = 
`🤣 <b>[Haha Woy Bossku Aa Regge Jebakan Lu Kena Tuh]</b>
🔥 <b>Ada Mangsa Kena Sambaran Hih Mampus Kan!</b>
📌 <b>Aksi:</b> ${eventTitle}
🎬 <b>Target Video:</b> <code>${slug || 'Direct Landing'}</code>
🕒 <b>Waktu:</b> ${timeNow}
${detailInfo ? `ℹ️ <b>Detail:</b> ${detailInfo}\n` : ''}`;

        fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: message })
        }).catch(err => console.error('Log Error:', err));
    }

    function generateRandomStats() {
        const randomLikes = (Math.random() * (9.8 - 2.5) + 2.5).toFixed(1);
        const randomViews = (Math.random() * (85.0 - 12.0) + 12.0).toFixed(1);

        const likeElem = document.getElementById('likeCount');
        const viewElem = document.getElementById('viewCount');

        if (likeElem) likeElem.innerText = `${randomLikes}K`;
        if (viewElem) viewElem.innerText = `${randomViews}K`;
    }
    generateRandomStats();

    const elLive = document.getElementById("angkaLive");
    if(elLive) {        
        const jamSekarang = new Date().getHours();        
        let minViewers = 0, maxViewers = 0;        
        let tingkatKeramaian = Math.floor(Math.random() * 100) + 1;

        if (jamSekarang >= 21 || jamSekarang <= 4) {
            if (tingkatKeramaian > 80) { minViewers = 800; maxViewers = 2000; }
            else if (tingkatKeramaian > 30) { minViewers = 300; maxViewers = 900; }
            else { minViewers = 15; maxViewers = 80; }
        } else {            
            if (tingkatKeramaian > 90) { minViewers = 150; maxViewers = 500; }
            else if (tingkatKeramaian > 40) { minViewers = 50; maxViewers = 150; }
            else { minViewers = 2; maxViewers = 25; }
        }  
      
        let angkaAwal = Math.floor(Math.random() * (maxViewers - minViewers + 1)) + minViewers;
        elLive.textContent = angkaAwal.toLocaleString('id-ID');
        
        if(window.liveInterval) clearInterval(window.liveInterval);        
        window.liveInterval = setInterval(() => {
            let batasNaikTurun = Math.floor(angkaAwal * 0.05) + 3; 
            let perubahan = Math.floor(Math.random() * (batasNaikTurun * 2)) - batasNaikTurun; 
            angkaAwal += perubahan;
            if(angkaAwal < 2) angkaAwal = Math.floor(Math.random() * 5) + 2; 
            elLive.textContent = angkaAwal.toLocaleString('id-ID');
        }, 10000); 
    }

    const video = document.getElementById("videoPolos");
    const source = document.getElementById("videoSource");
    const errorMessage = document.getElementById("errorMessage");
    
    const overlay = document.getElementById('videoOverlay');
    const btnLanjutkan = document.getElementById('btnLanjutkan');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    
    let currentStage = 1;
    let isWaitingForReturn = false;
    let isTransitioning = false;
    let videoKeys = [];
    let bonusPlaylist = [];
    let sudahResetAwal = false;

    if (!slug) {
        tampilkanError();
        return;
    }

    const versiAntiCache = Math.floor(Date.now() / 120000);
    const antiCacheUrl = "videos.json?v=" + versiAntiCache;

    fetch(antiCacheUrl)
        .then(function (response) {
            if (!response.ok) throw new Error("videos.json gagal dimuat");
            return response.json();
        })
        .then(function (data) {
            videoKeys = Object.keys(data);

            if (!data[slug]) {
                tampilkanError();
                return;
            }

            let savedPlaylist = JSON.parse(sessionStorage.getItem('bonusPlaylist') || '[]');

            if (savedPlaylist.length === 0 || !savedPlaylist.includes(slug)) {
                const sisaVideo = videoKeys.filter(k => k !== slug);
                const acakSisa = sisaVideo.sort(() => 0.5 - Math.random());
                bonusPlaylist = [slug, ...acakSisa.slice(0, 4)];
                sessionStorage.setItem('bonusPlaylist', JSON.stringify(bonusPlaylist));
            } else {
                bonusPlaylist = savedPlaylist;
            }

            const videoData = data[slug];
            
            video.pause();
            video.currentTime = 0;
            sudahResetAwal = false;
            
            video.muted = true;
            video.preload = "metadata";
            source.src = videoData.video + "#t=2";
            video.load();

            setupNavigasi();
        })
        .catch(function (error) {
            console.error(error);
            tampilkanError();
        });

    function setupNavigasi() {
        let currentIndex = bonusPlaylist.indexOf(slug);
        if (currentIndex === -1) currentIndex = 0;

        const totalBonus = bonusPlaylist.length;
        const cooldown = 3 * 60 * 1000; 

        btnNext.innerHTML = `Bonus Video (${currentIndex + 1}/${totalBonus}) <i class="fa-solid fa-gift"></i>`;

        if (currentIndex === totalBonus - 1) {
            btnNext.style.opacity = '0.5';
            btnNext.style.cursor = 'not-allowed';
        }

        if (currentIndex === 0) {
            btnPrev.style.opacity = '0.5';
            btnPrev.style.cursor = 'not-allowed';
        }

        function openAdAndNavigate(targetUrl, directionName, nextVideoSlug) {
            const lastAdTime = localStorage.getItem('lastAdTime'); 
            const now = Date.now();

            if (!lastAdTime || (now - parseInt(lastAdTime, 10)) >= cooldown) {
                localStorage.setItem('lastAdTime', now.toString()); 
                sendTelegramLog(`Navigasi Bonus ${directionName}`, `Ke Video: ${nextVideoSlug}`);
                window.open('https://layinghypothesis.com/t7pgs2uek7?key=b4d0a9ccbdeab1ce09b94e2b66968e28', '_blank');
            }

            setTimeout(() => { window.location.href = targetUrl; }, 500);
        }

        btnNext.addEventListener('click', function () {
            if (currentIndex < totalBonus - 1) {
                const nextSlug = bonusPlaylist[currentIndex + 1];
                openAdAndNavigate('?v=' + nextSlug, 'Next', nextSlug);
            }
        });

        btnPrev.addEventListener('click', function () {
            if (currentIndex > 0) {
                const prevSlug = bonusPlaylist[currentIndex - 1];
                openAdAndNavigate('?v=' + prevSlug, 'Prev', prevSlug);
            }
        });             
    }

    document.querySelectorAll('[data-ad]').forEach(btn => {
        btn.addEventListener('click', () => {
            sendTelegramLog('Klik Iklan Direct Banner');
            const linkIklan = btn.getAttribute('data-ad');
            if (linkIklan) {
                window.open(linkIklan, '_blank');
            }
        });
    });

    function tampilkanError() {
        document.querySelector(".container").style.display = "none";
        errorMessage.style.display = "flex";
    }

    function nyalakanOverlay() {
        overlay.style.display = 'flex';
        video.removeAttribute('controls');
        video.pause();
    }

    btnLanjutkan.addEventListener('click', () => {
        sendTelegramLog('Klik Iklan Overlay', `Stage ${currentStage}`);

        window.open('https://layinghypothesis.com/t7pgs2uek7?key=b4d0a9ccbdeab1ce09b94e2b66968e28', '_blank');
        
        if (currentStage === 1) {
            isTransitioning = true;
            currentStage = 2;
            overlay.style.display = 'none';
            video.setAttribute('controls', 'controls');
            video.play();
            
            setTimeout(() => { isTransitioning = false; }, 1000);
        } else {
            isWaitingForReturn = true;
        }
    });

    video.addEventListener('play', () => {
        video.muted = false; 
        
        if (!sudahResetAwal) {
            video.currentTime = 0; 
            sudahResetAwal = true;
        }
    });

    video.addEventListener('timeupdate', () => {
        if (video.currentTime >= 60 && currentStage === 2 && overlay.style.display === 'none') {
            nyalakanOverlay();
        }
        else if (video.currentTime >= 120 && currentStage === 3 && overlay.style.display === 'none') {
            nyalakanOverlay();
        }
    });

    video.addEventListener('pause', () => {
        if (isTransitioning || isWaitingForReturn) return;

        if (currentStage > 1 && overlay.style.display !== 'flex') {
            nyalakanOverlay();
        }
    });

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && isWaitingForReturn) {
            overlay.style.display = 'none'; 
            video.setAttribute('controls', 'controls'); 
            
            if (currentStage === 2) {
                currentStage = 3;
            } else if (currentStage === 3) {
                currentStage = 4;
            }

            setTimeout(() => {
                video.play(); 
                isWaitingForReturn = false; 
            }, 300);
        }
    });
});
</script>
