<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-width: 100%;
    background: #000;
    line-height: 0;
    overflow-x: hidden;
}

/* Style Header Logo */
/* Style Header Logo */
.site-header {
    width: 100%;
    background: #111111;
    padding: 14px 0; /* Diperbesar dari 10px biar atas bawah lebih longgar/luas */
    text-align: center;
    box-sizing: border-box;
    border-bottom: 1px solid #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 55px; /* Sedikit dinaikin biar makin proporsional */
}

.site-logo {
    display: flex;
    align-items: center;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: 600; /* Dibuat semi-bold biar lebih tegas */
    color: #cccccc;   /* Warnanya dinaikin sedikit biar lebih kontras dan jelas */
    line-height: normal;
    letter-spacing: 0.3px;
}

/* Style Logo PNG kamu */
.logo-png {
    height: 28px; /* Tinggal sesuaikan tinggi logo PNG nanti */
    width: auto;
    margin-left: 8px; /* Jarak antara tulisan "Video dari" dan logo */
    vertical-align: middle;
    filter: drop-shadow(0 0 10px rgba(235, 31, 114, 0.4));
}

/* Style Video Wrapper */
.video-wrapper {
    position: relative;
    display: block;
    width: 100%;
    margin: 0;
    padding: 0;
}

#videoPolos {
    display: block;
    width: 100%;
    height: auto;
    margin: 0;
    padding: 0;
    border: 0;
    outline: 0;
    background: #000;
}

/* Style Tombol Telegram */
.tele-wrapper {
    padding: 15px;
    box-sizing: border-box;
    width: 100%;
    background: #000;
}

.btn-telegram {
    display: block;
    width: 100%;
    padding: 16px 0;
    background: #00b862;
    color: #ffffff;
    font-family: Arial, sans-serif;
    font-size: 16px;
    font-weight: bold;
    text-align: center;
    text-decoration: none;
    border-radius: 12px;
    box-sizing: border-box;
    line-height: normal;
    letter-spacing: 0.5px;
}

.btn-telegram:active {
    background: #009e53;
}

#errorMessage {
    display: none;
    width: 100%;
    min-height: 100vh;
    box-sizing: border-box;
    align-items: center;
    justify-content: center;
    color: #fff;
    background: #000;
    font-family: Arial, sans-serif;
    font-size: 16px;
    line-height: normal;
    text-align: center;
}
   /* CSS Banner Teks & Link */
/* CSS CONTAINER BANNER BARU */
.text-banner-container {
    width: 100%;
    background: #111111; /* Samain warna background header */
    padding: 0; /* Padding di handle sama elemen di dalamnya */
    box-sizing: border-box;
    border-top: 1px solid #1a1a1a;  /* Garis pemisah atas dengan video */
    border-bottom: 1px solid #1a1a1a; /* Garis pemisah bawah dengan tombol tele */
}

/* CSS TEKS BANNERNYA (DIBUAT LEBIH RINGKAS) */
.more-video-banner {
    color: #cccccc;
    font-family: Arial, sans-serif;
    font-size: 14px;
    text-align: center;
    padding: 12px 15px; /* Padding aman buat teks */
    box-sizing: border-box;
    /* border-top: 0; <-- Tidak perlu lagi, sudah ditangani container */
    /* border-bottom: 0; <-- Tidak perlu lagi, sudah ditangani container */
}

/* CSS ANIMASI PULSE GLOW (Tetap sama seperti sebelumnya) */
.more-video-banner a {
    color: #eb1f72; /* Warna pink senada logo */
    font-weight: bold;
    text-decoration: none;
    display: inline-block;
    animation: pulse-glow 2s infinite;
}

.more-video-banner a:hover {
    text-decoration: underline;
    animation: none;
}

/* (@keyframes pulse-glow tetap ada di bawah ini) */

/* DEFINISI ANIMASI PULSING GLOW */
@keyframes pulse-glow {
    0% {
        text-shadow: 0 0 0 rgba(235, 31, 114, 0);
        transform: scale(1);
    }
    50% {
        text-shadow: 0 0 10px rgba(235, 31, 114, 0.8); /* Pendaran glow membesar */
        transform: scale(1.05); /* Teks sedikit membesar */
    }
    100% {
        text-shadow: 0 0 0 rgba(235, 31, 114, 0);
        transform: scale(1); /* Kembali ke ukuran normal */
    }
}
</style>

<!-- KODE POPUNDER RESMI ADSTERRA -->
<script src="https://layinghypothesis.com/d8/56/22/d8562243fc17b32f31bf3214d6cb59d1.js"></script>

</head>

<body>


<!-- HEADER / LOGO BRAND -->
<div class="site-header">
    <div class="site-logo">
        Video Dari : 
        <img src="https://image.zonexhub.net/BQACAgUAAyEFAAMBA-dBOQADCWqIKzMpRtqJMuRCCYCQsXgAASN_iAACrCEAAub3QVRhS0GeITryyT0E" class="logo-png">
    </div>
</div>

<div class="video-wrapper">
    <video
        id="videoPolos"
        controls
        playsinline
        preload="metadata">
        <source
            id="videoSource"
            src=""
            type="video/mp4">
    </video>
</div>

<!-- TEKS & BACKLINK DENGAN EFEK DENYUT -->
<div class="text-banner-container">
    <div class="more-video-banner">
        Mau video full & update lainnya? Kunjungi <a href="https://zonexhub.net" target="_blank" rel="noopener noreferrer">ZoneXhub.net</a>
    </div>
</div>

<!-- TOMBOL TELEGRAM (Sudah ada) -->
<div class="tele-wrapper">
    <a href="https://t.me/+9yfRTEBsNSNjNWVl" target="_blank" rel="noopener noreferrer" class="btn-telegram">
        JOIN TELEGRAM BUAT STOK TERBARU
    </a>
</div>

<div id="errorMessage">
    Video tidak ditemukan.
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("v");
    const video = document.getElementById("videoPolos");
    const source = document.getElementById("videoSource");
    const errorMessage = document.getElementById("errorMessage");

    if (!slug) {
        tampilkanError();
        return;
    }

    fetch("videos.json")
        .then(function (response) {
            if (!response.ok) {
                throw new Error("videos.json gagal dimuat");
            }
            return response.json();
        })
        .then(function (data) {
            const videoData = data[slug];
            if (!videoData) {
                tampilkanError();
                return;
            }
            source.src = videoData.video;
            video.load();
        })
        .catch(function (error) {
            console.error(error);
            tampilkanError();
        });

    function tampilkanError() {
        video.style.display = "none";
        document.querySelector(".site-header").style.display = "none";
        document.querySelector(".tele-wrapper").style.display = "none";
        errorMessage.style.display = "flex";
    }
});
</script>

</body>
</html>
