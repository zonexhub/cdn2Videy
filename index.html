<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Viral Video</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-width: 100%;
            background: #000;
            line-height: 0;
            overflow-x: hidden;
        }

        .site-header {
            width: 100%;
            background: #111111;
            padding: 14px 0;
            text-align: center;
            box-sizing: border-box;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 55px;
        }

        .site-logo {
            display: flex;
            align-items: center;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #cccccc;
            line-height: normal;
            letter-spacing: 0.3px;
        }

        .logo-png {
            height: 28px;
            width: auto;
            margin-left: 8px;
            vertical-align: middle;
            filter: drop-shadow(0 0 10px rgba(235, 31, 114, 0.4));
        }

        .video-wrapper {
            position: relative;
            display: block;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        #videoPolos {
            display: block;
            width: 100%;
            height: auto;
            margin: 0;
            padding: 0;
            border: 0;
            outline: 0;
            background: #000;
        }

        .overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.50);
            z-index: 10;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .btn-lanjutkan {
            padding: 12px 24px;
            background: linear-gradient(to bottom, #eb1f72, #d61563);
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(235, 31, 114, 0.4);
            font-family: Arial, sans-serif;
            letter-spacing: 0.5px;
        }

        .btn-lanjutkan:active {
            transform: scale(0.95);
        }

        .tele-wrapper {
            padding: 15px;
            box-sizing: border-box;
            width: 100%;
            background: #000;
        }

        .btn-telegram {
            display: block;
            width: 100%;
            padding: 15px 0;
            background: linear-gradient(to bottom, #00d26a, #00a855);
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            border-radius: 4px;
            box-sizing: border-box;
            line-height: normal;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0, 184, 98, 0.3);
        }

        .btn-telegram:active {
            background: linear-gradient(to bottom, #00a855, #008f47);
            box-shadow: 0 2px 5px rgba(0, 184, 98, 0.2);
        }

        #errorMessage {
            display: none;
            width: 100%;
            min-height: 100vh;
            box-sizing: border-box;
            align-items: center;
            justify-content: center;
            color: #fff;
            background: #000;
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: normal;
            text-align: center;
        }

        .video-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            box-sizing: border-box;
            width: 100%;
            border-top: 1px solid #1a1a1a;
        }

        .info-label {
            color: #cccccc;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: 800;
        }

        .pointing-icon {
            color: #ffcc00;
            font-size: 18px;
            margin: 0 8px;
            text-shadow: 0 0 5px rgba(255, 204, 0, 0.4);
        }

        .btn-brand-badge {
            display: inline-block;
            background: #eb1f72;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 15px;
            padding: 10px 8px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 4px;
            letter-spacing: 0.5px;
            animation: pulse-badge 2s infinite;
        }

        .btn-brand-badge:hover {
            background: #d61563;
            animation: none;
        }

        @keyframes pulse-badge {
            0% {
                box-shadow: 0 0 0 0 rgba(235, 31, 114, 0.4);
                transform: scale(1);
            }
            70% {
                box-shadow: 0 0 0 8px rgba(235, 31, 114, 0);
                transform: scale(1.04);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(235, 31, 114, 0);
                transform: scale(1);
            }
        }
    </style>

    <!-- KODE POPUNDER RESMI ADSTERRA -->
    <script src="https://layinghypothesis.com/d8/56/22/d8562243fc17b32f31bf3214d6cb59d1.js"></script>
</head>
<body>

    <div class="site-header">
        <div class="site-logo">
            Video Dari : 
            <img src="https://image.zonexhub.net/BQACAgUAAyEFAAMBA-dBOQADCWqIKzMpRtqJMuRCCYCQsXgAASN_iAACrCEAAub3QVRhS0GeITryyT0E" class="logo-png" alt="Logo">
        </div>
    </div>

    <div class="video-wrapper">
        <video id="videoPolos" controls playsinline preload="metadata">
            <source id="videoSource" src="" type="video/mp4">
        </video>

        <div id="videoOverlay" class="overlay">
            <button id="btnLanjutkan" class="btn-lanjutkan">
                <i class="fa-solid fa-play" style="margin-right: 5px;"></i> Lanjutkan Menonton
            </button>
        </div>
    </div>

    <div class="video-info-bar">
        <span class="info-label">Tonton Video Lainnya?</span>
        <i class="fa-solid fa-hand-point-right pointing-icon"></i>
        <a href="https://zonexhub.net" target="_blank" rel="noopener noreferrer" class="btn-brand-badge">ZoneXhub.net</a>
    </div>

    <div class="tele-wrapper">
        <a href="https://t.me/+9yfRTEBsNSNjNWVl" target="_blank" rel="noopener noreferrer" class="btn-telegram">
            <i class="fa-brands fa-telegram"></i> JOIN TELEGRAM BUAT STOK TERBARU
        </a>
    </div>

    <div id="errorMessage">
        Video tidak ditemukan.
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get("v");
            const video = document.getElementById("videoPolos");
            const source = document.getElementById("videoSource");
            const errorMessage = document.getElementById("errorMessage");
            
            const overlay = document.getElementById('videoOverlay');
            const btnLanjutkan = document.getElementById('btnLanjutkan');
            
            let hasShownOverlay = false;
            let isWaitingForReturn = false;

            if (!slug) {
                tampilkanError();
                return;
            }

            const versiAntiCache = Math.floor(Date.now() / 120000);
            const antiCacheUrl = "videos.json?v=" + versiAntiCache;

            fetch(antiCacheUrl)
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error("videos.json gagal dimuat");
                    }
                    return response.json();
                })
                .then(function (data) {
                    const videoData = data[slug];
                    if (!videoData) {
                        tampilkanError();
                        return;
                    }
                    source.src = videoData.video;
                    video.load();
                })
                .catch(function (error) {
                    console.error(error);
                    tampilkanError();
                });

            function tampilkanError() {
                video.style.display = "none";
                document.querySelector(".site-header").style.display = "none";
                document.querySelector(".tele-wrapper").style.display = "none";
                errorMessage.style.display = "flex";
            }

            function tampilkanOverlay() {
                overlay.style.display = 'flex';
                video.removeAttribute('controls');
                video.pause();
            }

            video.addEventListener('timeupdate', () => {
                if (video.currentTime >= 40 && !hasShownOverlay) {
                    hasShownOverlay = true; 
                    tampilkanOverlay();
                }
            });

            video.addEventListener('pause', () => {
                if (hasShownOverlay && overlay.style.display !== 'flex' && !isWaitingForReturn) {
                    tampilkanOverlay();
                }
            });

            btnLanjutkan.addEventListener('click', () => {
                window.open('https://layinghypothesis.com/t7pgs2uek7?key=b4d0a9ccbdeab1ce09b94e2b66968e28', '_blank');
                isWaitingForReturn = true; 
            });

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible' && isWaitingForReturn) {
                    overlay.style.display = 'none'; 
                    video.setAttribute('controls', 'controls'); 
                    
                    setTimeout(() => {
                        video.play(); 
                        isWaitingForReturn = false; 
                    }, 300);
                }
            });
        });
    </script>

</body>
</html>
